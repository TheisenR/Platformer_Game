<style>
  :root {
    --ink: #0f1220;
    --ink-2: #171b30;
    --parchment: #f4ecd8;
    --brass: #d9a441;
    --brass-dim: #a67c2e;
    --wood: #6b4226;
    --teal: #4fd1c5;
    --danger: #e2574c;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(ellipse at top, #1b2040 0%, var(--ink) 65%);
    color: var(--parchment);
    font-family: 'Space Grotesk', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 14px;
    padding: 18px 12px calc(18px + env(safe-area-inset-bottom, 0px));
    overflow-x: hidden;
  }

  header { text-align: center; max-width: 640px; }

  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(16px, 4vw, 26px);
    letter-spacing: 1px;
    color: var(--brass);
    margin: 0 0 8px 0;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.4);
  }

  header p { margin: 0; color: rgba(244,236,216,0.7); font-size: 14px; line-height: 1.5; }

  #game-shell {
    position: relative;
    width: min(960px, 100%);
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 0 3px var(--brass-dim), 0 0 0 6px var(--wood), 0 20px 60px rgba(0,0,0,0.6);
    background: var(--ink-2);
  }

  #game-container { width: 100%; height: 100%; }
  #game-container canvas { width: 100% !important; height: 100% !important; display: block; }

  .controls-hint {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 22px;
    justify-content: center;
    max-width: 720px;
    font-size: 13px;
    color: rgba(244,236,216,0.65);
  }

  .controls-hint kbd {
    background: var(--ink-2);
    border: 1px solid var(--brass-dim);
    border-radius: 4px;
    padding: 2px 7px;
    font-family: monospace;
    color: var(--brass);
    font-size: 12px;
  }

  footer { font-size: 12px; color: rgba(244,236,216,0.35); margin-top: 4px; }
</style>
</head>

<header>
  <h1>ESCAPE THE ACADEMY</h1>
  <p>A trapped student's run through four wings of a haunted school. Grab the key, dodge the staff, reach the portal.</p>
</header>

  <div id="game-container"></div>

  <span><kbd>ESC</kbd> pause</span>
  <span><kbd>M</kbd> mute</span>

      if (ac.state === 'suspended') ac.resume();
      var osc = ac.createOscillator();
      var gain = ac.createGain();
      osc.type = type || 'square';
      osc.frequency.value = freq;
      gain.gain.value = gainVal || 0.06;
      osc.connect(gain);

      var now = ac.currentTime;

      osc.start(now);

  function burst(scene, x, y, tint, count) {
    var emitter = scene.add.particles(x, y, 'spark', {
      speed: { min: 60, max: 170 }, scale: { start: 1.1, end: 0 },
      lifespan: 420, tint: tint, blendMode: 'ADD', emitting: false

    emitter.explode(count || 8);
    scene.time.delayedCall(500, function () { emitter.destroy(); });
  }

    groundSet('metal', 0x5c7a78, 0x3c5654, 0x233634, 0x1a2827);
    groundSet('metal2', 0x4a6a9c, 0x314b73, 0x1d2e4d, 0x16233d);
    groundSet('stone', 0x8a5f52, 0x6b4038, 0x422523, 0x321a19);

    // rivets/detail overlay for metal sets (small dots)
    ['metal', 'metal2'].forEach(function (p) {
      var img = g;

    // ---- coin / key / portal ----
    g.fillStyle(0xd9a441, 1); g.fillCircle(12, 12, 12);

    g.fillStyle(0x7be3bd, 1); g.fillRoundedRect(12, 12, 20, 46, 6);
    g.generateTexture('portal', 44, 70);
    g.clear();

    // ---- enemy: ground patrol (warden) ----
    g.fillStyle(0xe2574c, 1); g.fillRoundedRect(0, 4, 32, 26, 6);
    g.fillStyle(0x0f1220, 1); g.fillRect(6, 12, 6, 6); g.fillRect(20, 12, 6, 6);
    g.fillStyle(0xf4ecd8, 1); g.fillRect(6, 26, 6, 4); g.fillRect(20, 26, 6, 4);
    g.generateTexture('enemyPatrol', 32, 32);
    g.clear();

    g.fillTriangle(0, 14, 8, 2, 10, 16);
    g.fillTriangle(32, 14, 24, 2, 22, 16);
    g.fillStyle(0xffe27a, 1); g.fillCircle(11, 15, 3); g.fillCircle(21, 15, 3);
    g.fillStyle(0x0f1220, 1); g.fillCircle(11, 15, 1.4); g.fillCircle(21, 15, 1.4);
    g.generateTexture('enemyFlyer', 32, 26);
    g.clear();

    // ---- hazard: spikes ----
    g.fillStyle(0x9aa0b4, 1);
    for (var s = 0; s < 4; s++) g.fillTriangle(s * 16, 24, s * 16 + 8, 2, s * 16 + 16, 24);
    g.generateTexture('spikes', 64, 24);
    g.clear();

    // ---- player start/idle placeholder (fallback if sheet fails) ----

    g.fillCircle(9, 10, 8); g.fillCircle(19, 10, 8); g.fillTriangle(2, 13, 28, 13, 14, 28);
    g.generateTexture('puLife', 28, 28);
    g.clear();

    g.fillStyle(0x5fc9ff, 1);
    g.fillTriangle(14, 0, 28, 8, 14, 16);
    g.fillTriangle(14, 0, 0, 8, 14, 16);
    g.fillTriangle(14, 12, 28, 20, 14, 28);
    g.fillTriangle(14, 12, 0, 20, 14, 28);
    g.generateTexture('puShield', 28, 28);
    g.clear();

    g.fillStyle(0xffd93d, 1);
    g.fillTriangle(16, 0, 4, 16, 14, 16);
    g.fillTriangle(14, 16, 24, 16, 10, 30);
    g.generateTexture('puSpeed', 28, 30);
    g.destroy();

    // ---- animations ----
    if (this.textures.exists('hero')) {
      this.anims.create({ key: 'walk', frames: this.anims.generateFrameNumbers('hero', { start: 0, end: 3 }), frameRate: 9, repeat: -1 });

  // =========================================================================
  //  LEVEL SELECT
  // =========================================================================
  function SelectScene() { Phaser.Scene.call(this, { key: 'Select' }); }
  SelectScene.prototype = Object.create(Phaser.Scene.prototype);
  SelectScene.prototype.constructor = SelectScene;
  SelectScene.prototype.create = function () {
    this.cameras.main.fadeIn(260, 15, 18, 32);
    playMusic([392, 0, 494, 0, 587, 0, 494, 392], 0.34, 'triangle');

    this.add.image(W / 2, H / 2, 'bgMenu');
    this.add.text(W / 2, 46, 'CHOOSE YOUR WING', {
      fontFamily: '"Press Start 2P"', fontSize: '20px', color: '#d9a441'
    }).setOrigin(0.5);

    var sv = loadSave();
    var self = this;
    var cardW = 200, cardH = 300, gap = 24;
    var totalW = LEVELS.length * cardW + (LEVELS.length - 1) * gap;
    var startX = W / 2 - totalW / 2 + cardW / 2;
    this.selected = 0;
    this.cards = [];

    LEVELS.forEach(function (lv, i) {
      var cx = startX + i * (cardW + gap);
      var cy = H / 2 + 20;
      var unlocked = sv.unlocked >= lv.id;

      var box = self.add.rectangle(cx, cy, cardW, cardH, unlocked ? 0x171b30 : 0x14141c, 1)
        .setStrokeStyle(3, unlocked ? lv.accent : 0x3a3a44);

      var swatch = self.add.rectangle(cx, cy - cardH / 2 + 40, cardW - 30, 60, lv.accent, unlocked ? 0.85 : 0.15);

      var title = self.add.text(cx, cy - 60, lv.short, {
        fontFamily: '"Press Start 2P"', fontSize: '12px', color: unlocked ? '#f4ecd8' : '#555'
      }).setOrigin(0.5);

      var name = self.add.text(cx, cy - 30, lv.name, {
        fontFamily: 'monospace', fontSize: '13px', color: unlocked ? '#d9a441' : '#555', wordWrap: { width: cardW - 24 }, align: 'center'
      }).setOrigin(0.5);

      var status;
      if (!unlocked) {
        status = self.add.text(cx, cy + 30, '\uD83D\uDD12 LOCKED', { fontFamily: 'monospace', fontSize: '13px', color: '#666' }).setOrigin(0.5);
      } else {
        var best = sv.scores[lv.id] || 0;
        status = self.add.text(cx, cy + 30, 'Best: ' + best, { fontFamily: 'monospace', fontSize: '13px', color: '#4fd1c5' }).setOrigin(0.5);
      }

      var hint = self.add.text(cx, cy + cardH / 2 - 26, unlocked ? 'ENTER / CLICK' : '', {
        fontFamily: 'monospace', fontSize: '11px', color: '#888'
      }).setOrigin(0.5);

      box.setInteractive({ useHandCursor: unlocked });
      box.on('pointerdown', function () {
        if (!unlocked) { SFX.hit(); return; }
        self.selected = i;
        self.launchLevel(lv.id);
      });
      box.on('pointerover', function () { if (unlocked) { self.selected = i; self.refreshHighlight(); } });

      self.cards.push({ box: box, unlocked: unlocked, id: lv.id });
    });

    this.refreshHighlight = function () {
      self.cards.forEach(function (c, i) {
        c.box.setStrokeStyle(3, i === self.selected ? 0xffffff : (c.unlocked ? LEVELS[i].accent : 0x3a3a44));
      });
    };
    this.refreshHighlight();

    this.add.text(W / 2, H - 66,
      '\u2764 extra life    \uD83D\uDD37 shield (temp. invincible)    \u26A1 speed boost    Stomp foes from above to defeat them',
      { fontFamily: 'monospace', fontSize: '11px', color: '#999' }
    ).setOrigin(0.5);

    var backTxt = this.add.text(20, H - 26, '\u2190 back to menu', { fontFamily: 'monospace', fontSize: '12px', color: '#888' })
      .setInteractive({ useHandCursor: true });
    backTxt.on('pointerdown', function () { fadeToScene(self, 'Menu'); });

    addMuteToggle(this);

    this.launchLevel = function (id) {
      SFX.click();
      fadeToScene(self, 'Game', { levelId: id });
    };

    this.input.keyboard.on('keydown-LEFT', function () {
      self.selected = Math.max(0, self.selected - 1); self.refreshHighlight(); SFX.click();
    });
    this.input.keyboard.on('keydown-RIGHT', function () {
      self.selected = Math.min(LEVELS.length - 1, self.selected + 1); self.refreshHighlight(); SFX.click();
    });
    this.input.keyboard.on('keydown-ENTER', function () {
      var c = self.cards[self.selected];
      if (c.unlocked) self.launchLevel(c.id); else SFX.hit();
    });
    this.input.keyboard.on('keydown-SPACE', function () {
      var c = self.cards[self.selected];
      if (c.unlocked) self.launchLevel(c.id); else SFX.hit();
    });
    this.input.keyboard.once('keydown-ESC', function () { fadeToScene(self, 'Menu'); });
  };

  // =========================================================================
  //  GAME
  // =========================================================================
  function GameScene() { Phaser.Scene.call(this, { key: 'Game' }); }
  GameScene.prototype = Object.create(Phaser.Scene.prototype);
  GameScene.prototype.constructor = GameScene;

  GameScene.prototype.init = function (data) {
    this.levelId = data.levelId || 1;
    this.lv = LEVELS[this.levelId - 1];
  };

  GameScene.prototype.create = function () {
    var self = this;
    var lv = this.lv;

    this.cameras.main.fadeIn(300, 15, 18, 32);
    var musicPatterns = {
      1: [349, 0, 415, 0, 494, 415, 349, 0],
      2: [220, 262, 0, 294, 220, 0, 330, 294],
      3: [196, 0, 233, 0, 262, 233, 196, 0],
      4: [261, 293, 329, 391, 329, 293, 261, 0]
    };
    playMusic(musicPatterns[this.levelId] || musicPatterns[1], 0.26, this.levelId === 4 ? 'sawtooth' : 'triangle', 0.024);

    this.score = 0;
    this.lives = 3;
    this.hasKey = false;
    this.invincible = false;
    this.gameEnded = false;
    this.shieldUntil = 0;
    this.speedUntil = 0;

    this.matGround = lv.mat + 'Ground';
    this.matPlat = lv.mat + 'Plat';

    this.add.image(0, 0, 'bg' + lv.id).setOrigin(0, 0).setDisplaySize(lv.width, H).setScrollFactor(0.15);
    this.add.tileSprite(0, 40, lv.width, 210, 'decor').setOrigin(0, 0).setAlpha(0.4).setTint(lv.accent).setScrollFactor(0.4);

    this.physics.world.setBounds(0, 0, lv.width, H);
    this.cameras.main.setBounds(0, 0, lv.width, H);

    // ---- ground & pits ----
    this.platforms = this.physics.add.staticGroup();
    this.spikes = this.physics.add.staticGroup();

    var segs = lv.ground.slice().sort(function (a, b) { return a.start - b.start; });
    segs.forEach(function (seg) {
      for (var i = 0; i < seg.count; i++) {
        self.platforms.create(seg.start + i * 64 + 32, GROUND_Y + 24, self.matGround).setOrigin(0.5, 0.5).refreshBody();
      }
    });
    for (var i = 0; i < segs.length - 1; i++) {
      var gapStart = segs[i].start + segs[i].count * 64;
      var gapEnd = segs[i + 1].start;
      if (gapEnd > gapStart) {
        var pw = gapEnd - gapStart;
        var spike = this.spikes.create((gapStart + gapEnd) / 2, GROUND_Y - 12, 'spikes');
        spike.setDisplaySize(pw, 24).refreshBody();
        spike.setTint(lv.hazardTint);
      }
    }

    // ---- floating platforms ----
    lv.platforms.forEach(function (p) { self.platforms.create(p[0], p[1], self.matPlat).refreshBody(); });

    // ---- moving platforms ----
    this.movers = this.physics.add.group({ allowGravity: false, immovable: true });
    lv.movers.forEach(function (m) {
      var mp = self.movers.create(m.x !== undefined ? m.x : m.x0, m.y !== undefined ? m.y : m.y0, m.mat + 'Plat');
      mp.setTint(0x66e0ff);
      mp.axis = m.axis; mp.minV = m.min; mp.maxV = m.max; mp.speed = m.speed;
      mp.prevX = mp.x; mp.prevY = mp.y;
      if (m.axis === 'x') mp.body.setVelocityX(m.speed); else mp.body.setVelocityY(m.speed);
      mp.body.setImmovable(true);
    });

    // ---- player ----
    this.player = this.physics.add.sprite(lv.start[0], lv.start[1], this.textures.exists('hero') ? 'hero' : 'heroFallback');
    this.player.setCollideWorldBounds(true);
    this.player.setBounce(0.05);
    this.player.body.setSize(20, 28).setOffset(6, 4);
    this.player.setDepth(10);
    this.physics.add.collider(this.player, this.platforms);
    this.physics.add.collider(this.player, this.movers, function () { self.ridingMover = true; });

    this.cameras.main.startFollow(this.player, true, 0.09, 0.09);
    this.cameras.main.setDeadzone(120, 120);

    // ---- coins ----
    this.coins = this.physics.add.group({ allowGravity: false });
    lv.coins.forEach(function (p) {
      var c = self.coins.create(p[0], p[1], 'coin');
      self.tweens.add({ targets: c, y: p[1] - 8, duration: 700, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    });

    // ---- key ----
    this.keyItem = this.physics.add.sprite(lv.key[0], lv.key[1], 'key');
    this.keyItem.body.setAllowGravity(false);
    this.tweens.add({ targets: this.keyItem, y: lv.key[1] - 10, duration: 800, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    this.tweens.add({ targets: this.keyItem, angle: 10, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

    // ---- portal ----
    this.portal = this.physics.add.staticSprite(lv.portal[0], lv.portal[1], 'portal');
    this.portal.setTint(0x555555);

    // ---- power-ups ----
    this.powerups = this.physics.add.group({ allowGravity: false });
    lv.powerups.forEach(function (p) {
      var tex = p.type === 'life' ? 'puLife' : (p.type === 'shield' ? 'puShield' : 'puSpeed');
      var pu = self.powerups.create(p.x, p.y, tex);
      pu.puType = p.type;
      self.tweens.add({ targets: pu, y: p.y - 10, duration: 650, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    });

    // ---- enemies ----
    this.enemies = this.physics.add.group({ allowGravity: false });
    lv.enemies.forEach(function (e) {
      var tex = e.type === 'flyer' ? 'enemyFlyer' : 'enemyPatrol';
      var en = self.enemies.create(e.x, e.y, tex);
      en.body.setAllowGravity(false);
      en.enemyType = e.type;
      en.minX = e.min; en.maxX = e.max; en.enemySpeed = e.speed;
      en.setVelocityX(e.speed);
      if (e.type === 'flyer') {
        en.baseY = e.y; en.minY = e.ymin; en.maxY = e.ymax; en.bobT = Math.random() * 1000;
      }
    });

    // ---- overlaps ----
    this.physics.add.overlap(this.player, this.coins, this.collectCoin, null, this);
    this.physics.add.overlap(this.player, this.keyItem, this.collectKey, null, this);
    this.physics.add.overlap(this.player, this.portal, this.tryExit, null, this);
    this.physics.add.overlap(this.player, this.powerups, this.collectPowerup, null, this);
    this.physics.add.overlap(this.player, this.enemies, this.handleEnemyOverlap, null, this);
    this.physics.add.overlap(this.player, this.spikes, this.hitHazard, null, this);

    // ---- controls ----
    this.cursors = this.input.keyboard.createCursorKeys();
    this.keys = this.input.keyboard.addKeys('W,A,S,D,SPACE,ESC');

    // ---- HUD (fixed to camera) ----
    this.hudScore = this.add.text(16, 12, 'Score: 0', { fontFamily: 'monospace', fontSize: '16px', color: '#f4ecd8' }).setScrollFactor(0).setDepth(60);
    this.hudLives = this.add.text(16, 34, this.livesString(), { fontFamily: 'monospace', fontSize: '16px', color: '#e2574c' }).setScrollFactor(0).setDepth(60);
    this.hudKey = this.add.text(16, 56, 'Key: \u2716', { fontFamily: 'monospace', fontSize: '16px', color: '#888' }).setScrollFactor(0).setDepth(60);
    this.hudBuffs = this.add.text(16, 78, '', { fontFamily: 'monospace', fontSize: '13px', color: '#5fc9ff' }).setScrollFactor(0).setDepth(60);
    this.hudLevel = this.add.text(W - 90, 12, lv.short, { fontFamily: 'monospace', fontSize: '14px', color: '#'+lv.accent.toString(16) }).setScrollFactor(0).setDepth(60);
    this.hudMsg = this.add.text(W / 2, 70, '', {
      fontFamily: 'monospace', fontSize: '15px', color: '#f4ecd8', backgroundColor: '#0f1220', padding: { x: 8, y: 4 }
    }).setOrigin(0.5).setScrollFactor(0).setAlpha(0).setDepth(60);

    addMuteToggle(this).setScrollFactor(0).setDepth(60);

    // ---- pause overlay ----
    this.isPaused = false;
    this.pauseOverlay = this.add.container(0, 0).setDepth(90).setVisible(false).setScrollFactor(0);
    var pBg = this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.65);
    var pTxt = this.add.text(W / 2, H / 2 - 30, 'PAUSED', { fontFamily: '"Press Start 2P"', fontSize: '22px', color: '#d9a441' }).setOrigin(0.5);
    var pHint = this.add.text(W / 2, H / 2 + 10, 'ESC to resume', { fontFamily: 'monospace', fontSize: '14px', color: '#f4ecd8' }).setOrigin(0.5);
    var pQuit = this.add.text(W / 2, H / 2 + 44, '[ quit to level select ]', { fontFamily: 'monospace', fontSize: '13px', color: '#e2574c' }).setOrigin(0.5).setInteractive({ useHandCursor: true });
    pQuit.on('pointerdown', function () { if (self.isPaused) fadeToScene(self, 'Select'); });
    this.pauseOverlay.add([pBg, pTxt, pHint, pQuit]);

    this.input.keyboard.on('keydown-ESC', function () {
      if (self.gameEnded) return;
      self.isPaused = !self.isPaused;
      self.pauseOverlay.setVisible(self.isPaused);
      self.physics.world.isPaused = self.isPaused;
    });
  };

  GameScene.prototype.livesString = function () {

    for (var i = 0; i < this.lives; i++) hearts += '\u2764 ';
    return hearts.trim() || '\u2013';
  };

  GameScene.prototype.showMsg = function (text, color) {
    this.hudMsg.setText(text).setColor(color || '#f4ecd8').setAlpha(1);
    this.tweens.add({ targets: this.hudMsg, alpha: 0, delay: 900, duration: 400 });
  };

  GameScene.prototype.collectCoin = function (player, coin) {
    var x = coin.x, y = coin.y;
    coin.destroy();
    this.score += 10;
    this.hudScore.setText('Score: ' + this.score);
    burst(this, x, y, 0xd9a441, 6);
    SFX.coin();
  };

  GameScene.prototype.collectKey = function (player, key) {
    var x = key.x, y = key.y;
    key.destroy();
    this.hasKey = true;
    this.hudKey.setText('Key: \u2714').setColor('#4fd1c5');
    this.portal.clearTint();
    burst(this, x, y, 0xd9a441, 14);
    this.showMsg('Key collected! Reach the portal.', '#4fd1c5');
    SFX.key();
  };

  GameScene.prototype.collectPowerup = function (player, pu) {
    var type = pu.puType, x = pu.x, y = pu.y;
    pu.destroy();
    SFX.powerup();
    if (type === 'life') {
      this.lives = Math.min(this.lives + 1, 5);
      this.hudLives.setText(this.livesString());
      this.showMsg('+1 Life!', '#ff6b81');
      burst(this, x, y, 0xff6b81, 10);
    } else if (type === 'shield') {
      this.shieldUntil = this.time.now + 6000;
      this.showMsg('Shield active!', '#5fc9ff');
      burst(this, x, y, 0x5fc9ff, 10);
    } else if (type === 'speed') {
      this.speedUntil = this.time.now + 6000;
      this.showMsg('Speed boost!', '#ffd93d');
      burst(this, x, y, 0xffd93d, 10);
    }
  };

  GameScene.prototype.tryExit = function () {
    if (this.gameEnded) return;
    if (this.hasKey) this.winLevel();
    else this.showMsg('The portal is locked. Find the key!', '#e2574c');
  };

  GameScene.prototype.handleEnemyOverlap = function (player, enemy) {
    if (this.gameEnded) return;
    var stomping = player.body.velocity.y > 40 && (player.body.y + player.body.height * 0.6) < enemy.y;
    if (stomping) {
      burst(this, enemy.x, enemy.y, 0xffffff, 10);
      enemy.destroy();
      this.score += 20;
      this.hudScore.setText('Score: ' + this.score);
      player.setVelocityY(-320);
      SFX.stomp();
    } else {
      this.hitHazard(player);
    }
  };

  GameScene.prototype.hitHazard = function (player) {
    if (this.invincible || this.gameEnded) return;
    if (this.time.now < this.shieldUntil) return; // shielded — no damage

    this.lives -= 1;
    SFX.hit();
    this.cameras.main.shake(150, 0.008);
    this.hudLives.setText(this.livesString());

    var self = this;
    this.invincible = true;
    player.setVelocity(player.body.velocity.x > 0 ? -220 : 220, -260);
    this.tweens.add({
      targets: player, alpha: 0.25, duration: 100, yoyo: true, repeat: 6,
      onComplete: function () { player.setAlpha(1); self.invincible = false; }
    });

    if (this.lives <= 0) this.loseLevel();
  };

  GameScene.prototype.winLevel = function () {
    this.gameEnded = true;
    this.physics.pause();
    stopMusic();
    SFX.win();

    var sv = loadSave();
    sv.scores[this.levelId] = Math.max(sv.scores[this.levelId] || 0, this.score);
    var unlockedNext = false;
    if (this.levelId < LEVELS.length && sv.unlocked <= this.levelId) {
      sv.unlocked = this.levelId + 1;
      unlockedNext = true;
    }
    persistSave(sv);
    if (unlockedNext) setTimeout(SFX.unlock, 500);

    var self = this;
    this.time.delayedCall(300, function () {
      fadeToScene(self, 'End', { win: true, score: self.score, levelId: self.levelId, isFinal: self.levelId === LEVELS.length });
    });
  };

  GameScene.prototype.loseLevel = function () {
    this.gameEnded = true;
    this.physics.pause();
    stopMusic();
    SFX.lose();
    var sv = loadSave();
    sv.scores[this.levelId] = Math.max(sv.scores[this.levelId] || 0, this.score);
    persistSave(sv);
    var self = this;
    this.time.delayedCall(300, function () {
      fadeToScene(self, 'End', { win: false, score: self.score, levelId: self.levelId });
    });
  };

  GameScene.prototype.update = function (time, delta) {
    if (this.isPaused || this.gameEnded) return;
    var self = this;

    // buff HUD
    var buffTxt = [];
    if (time < this.shieldUntil) buffTxt.push('\uD83D\uDD37 shield ' + Math.ceil((this.shieldUntil - time) / 1000) + 's');
    if (time < this.speedUntil) buffTxt.push('\u26A1 speed ' + Math.ceil((this.speedUntil - time) / 1000) + 's');
    this.hudBuffs.setText(buffTxt.join('   '));

    var onFloor = this.player.body.blocked.down || this.player.body.touching.down;
    var speedBoost = time < this.speedUntil;
    var moveSpeed = speedBoost ? 320 : 220;
    var jumpVel = speedBoost ? -520 : -460;

    var left = this.cursors.left.isDown || this.keys.A.isDown;
    var right = this.cursors.right.isDown || this.keys.D.isDown;

    if (left) { this.player.setVelocityX(-moveSpeed); this.player.setFlipX(true); }
    else if (right) { this.player.setVelocityX(moveSpeed); this.player.setFlipX(false); }
    else { this.player.setVelocityX(0); }

    if (!onFloor) { this.player.anims.stop(); this.player.setFrame(this.textures.exists('hero') ? 2 : 0); }
    else if (left || right) { if (this.textures.exists('hero')) this.player.anims.play('walk', true); }
    else { this.player.anims.stop(); this.player.setFrame(0); }

    if (time < this.shieldUntil) this.player.setTint(0x8fe3ff); else this.player.clearTint();

    var jumpPressed = this.cursors.up.isDown || this.keys.W.isDown || this.keys.SPACE.isDown;
    if (jumpPressed && onFloor) { this.player.setVelocityY(jumpVel); SFX.jump(); }

    if (this.player.y > H + 60) {
      this.player.setPosition(this.lv.start[0], this.lv.start[1]);
      this.player.setVelocity(0, 0);
      this.hitHazard(this.player);
    }

    // ground enemy patrol
    this.enemies.children.iterate(function (e) {
      if (!e || !e.active) return;
      if (e.enemyType === 'patrol') {
        if (e.x <= e.minX) e.setVelocityX(Math.abs(e.enemySpeed));
        if (e.x >= e.maxX) e.setVelocityX(-Math.abs(e.enemySpeed));
      } else if (e.enemyType === 'flyer') {
        if (e.x <= e.minX) e.setVelocityX(Math.abs(e.enemySpeed));
        if (e.x >= e.maxX) e.setVelocityX(-Math.abs(e.enemySpeed));
        e.bobT += delta;
        e.y = e.baseY + Math.sin(e.bobT / 260) * ((e.maxY - e.minY) / 2);
      }
    });

    // moving platforms — carry the player along
    var playerOnMover = false;
    this.movers.children.iterate(function (m) {
      if (!m || !m.active) return;
      if (m.axis === 'x') {
        if (m.x <= m.minV) m.body.setVelocityX(Math.abs(m.speed));
        if (m.x >= m.maxV) m.body.setVelocityX(-Math.abs(m.speed));
      } else {
        if (m.y <= m.minV) m.body.setVelocityY(Math.abs(m.speed));
        if (m.y >= m.maxV) m.body.setVelocityY(-Math.abs(m.speed));
      }
      var dx = m.x - m.prevX, dy = m.y - m.prevY;
      var standingOn = self.player.body.touching.down &&
        Math.abs((self.player.body.bottom) - (m.body.top)) < 6 &&
        self.player.x > m.x - m.width / 2 - 6 && self.player.x < m.x + m.width / 2 + 6;
      if (standingOn) {
        self.player.x += dx;
        self.player.y += dy;
        playerOnMover = true;
      }
      m.prevX = m.x; m.prevY = m.y;
    });
  };

  // =========================================================================
  //  END SCREEN
  // =========================================================================
  function EndScene() { Phaser.Scene.call(this, { key: 'End' }); }
  EndScene.prototype = Object.create(Phaser.Scene.prototype);
  EndScene.prototype.constructor = EndScene;
  EndScene.prototype.create = function (data) {
    this.cameras.main.fadeIn(280, 15, 18, 32);
    var win = !!data.win;
    var sv = loadSave();
    var lv = LEVELS[data.levelId - 1];

    this.add.image(W / 2, H / 2, 'bg' + lv.id);

    if (win && data.isFinal) {
      playMusic([523, 659, 784, 1046, 784, 659], 0.3, 'triangle');
      this.add.text(W / 2, 150, 'YOU ESCAPED!', { fontFamily: '"Press Start 2P"', fontSize: '26px', color: '#4fd1c5' }).setOrigin(0.5);
      var scores = Object.keys(sv.scores).map(function (k) { return sv.scores[k]; });
      var total = scores.reduce(function (a, b) { return a + b; }, 0);
      this.add.text(W / 2, 200, 'All four wings cleared \u2014 total score: ' + total, { fontFamily: 'monospace', fontSize: '15px', color: '#f4ecd8' }).setOrigin(0.5);
    } else {
      this.add.text(W / 2, 150, win ? 'WING CLEARED' : 'GAME OVER', {
        fontFamily: '"Press Start 2P"', fontSize: '24px', color: win ? '#4fd1c5' : '#e2574c'
      }).setOrigin(0.5);
      this.add.text(W / 2, 195, lv.name, { fontFamily: 'monospace', fontSize: '14px', color: '#'+lv.accent.toString(16) }).setOrigin(0.5);
    }

    this.add.text(W / 2, 240, 'Score: ' + data.score, { fontFamily: 'monospace', fontSize: '16px', color: '#f4ecd8' }).setOrigin(0.5);
    this.add.text(W / 2, 265, 'Best on this wing: ' + (sv.scores[data.levelId] || 0), { fontFamily: 'monospace', fontSize: '13px', color: '#a67c2e' }).setOrigin(0.5);

    var y = 320;
    var self = this;
    var options = [];

    if (win && !data.isFinal && sv.unlocked > data.levelId) {
      options.push({ label: '[ SPACE: Next Wing ]', color: '#4fd1c5', action: function () { fadeToScene(self, 'Game', { levelId: data.levelId + 1 }); } });
    } else if (!win) {
      options.push({ label: '[ SPACE: Retry ]', color: '#d9a441', action: function () { fadeToScene(self, 'Game', { levelId: data.levelId }); } });
    }
    options.push({ label: 'Level Select', color: '#888', action: function () { fadeToScene(self, 'Select'); } });
    if (win) options.push({ label: 'Replay Wing', color: '#888', action: function () { fadeToScene(self, 'Game', { levelId: data.levelId }); } });

    options.forEach(function (opt, i) {
      var t = self.add.text(W / 2, y + i * 34, opt.label, { fontFamily: 'monospace', fontSize: '15px', color: opt.color }).setOrigin(0.5).setInteractive({ useHandCursor: true });
      t.on('pointerdown', function () { SFX.click(); opt.action(); });
      if (i === 0) self.tweens.add({ targets: t, alpha: 0.4, duration: 650, yoyo: true, repeat: -1 });
    });

    this.input.keyboard.once('keydown-SPACE', function () { SFX.click(); options[0].action(); });
    addMuteToggle(this);
  };

  // =========================================================================
  //  BOOTSTRAP
  // =========================================================================
  var config = {
    type: Phaser.AUTO,
    width: W,
    height: H,
    parent: 'game-container',
    backgroundColor: '#0f1220',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    physics: { default: 'arcade', arcade: { gravity: { y: 900 }, debug: false } },
    scene: [BootScene, MenuScene, SelectScene, GameScene, EndScene]
  };

  new Phaser.Game(config);
  log('Phaser.Game() constructed — booting scenes.');
  } // end runGame
})();
</script>
</body>
</html>
